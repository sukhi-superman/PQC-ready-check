# Builds the React frontend and publishes it to https://sukhi-superman.github.io/PQC-ready-check/
# Live scanning switches on when these repository variables are set (Settings → Secrets and variables
# → Actions → Variables):
#   VITE_API_URL             e.g. https://pqc-api.onrender.com   (empty = labelled sample reports only)
#   VITE_TURNSTILE_SITE_KEY  your Cloudflare Turnstile site key  (empty = Cloudflare's test key)
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund   # direct dependencies are pinned to exact versions
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
